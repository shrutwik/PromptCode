name: Backend CI

on:
  pull_request:
  push:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROMPTCODE_JWT_SECRET: ci-test-secret
      PROMPTCODE_DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock

      - name: Regenerate requirements.lock from requirements.txt
        run: |
          pip install pip-tools
          pip-compile requirements.txt --output-file=requirements.lock --strip-extras --quiet --no-header --allow-unsafe
          if ! git diff --quiet requirements.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requirements.lock
            git commit -m "chore: regenerate requirements.lock"
            git push
          fi

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend lint
        run: python -m ruff check app/ tests/ --select F,E9,I

      - name: Run backend type checks
        run: python -m mypy --strict --follow-imports=silent --ignore-missing-imports app/core/ app/api/ app/schemas/

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Enforce deployment hardening test floor
        run: |
          COLLECTED="$(pytest \
            tests/test_deploy_smoke.py \
            tests/test_deployment_contracts.py \
            tests/test_config_security.py \
            tests/test_health_readiness.py \
            tests/test_startup_migrations.py \
            --collect-only -q | awk '/::/ {count++} END {print count+0}')"
          if [ "${COLLECTED}" -lt 35 ]; then
            echo "Test regression: expected at least 35 tests, found ${COLLECTED}." >&2
            exit 1
          fi
          if [ "${COLLECTED}" -lt 38 ]; then
            echo "Deployment hardening coverage regression: expected at least 38 tests, found ${COLLECTED}." >&2
            exit 1
          fi

      - name: Check model schema integrity
        run: |
          python -c "
          import asyncio, app.models
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.db.base import Base
          async def check():
              e = create_async_engine('sqlite+aiosqlite:///:memory:')
              async with e.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await e.dispose()
              print('Schema OK — all models created cleanly')
          asyncio.run(check())
          "

      - name: Run backend tests
        run: pytest tests -q --tb=short -x --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Run release quality gates
        run: python -m scripts.run_release_quality_gates

  schema-drift:
    runs-on: ubuntu-latest
    env:
      PROMPTCODE_DATABASE_URL: postgresql+asyncpg://promptcode:promptcode@127.0.0.1:5432/promptcode
      PROMPTCODE_JWT_SECRET: ci-test-secret
      PROMPTCODE_SANDBOX_EXECUTOR_TOKEN: ci-sandbox-secret
      PROMPTCODE_DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promptcode
          POSTGRES_PASSWORD: promptcode
          POSTGRES_DB: promptcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptcode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Alembic migrations to Postgres
        run: alembic upgrade head

      - name: Check for schema drift
        run: alembic check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate .env.example contract
        run: bash scripts/validate-env.sh

      - name: Validate merged production compose config
        env:
          IMAGE_TAG: ci-validate
          DOMAIN: api.example.com
          PROMPTCODE_DB_PASSWORD: ci-test-db-password
          PROMPTCODE_JWT_SECRET: ci-prod-jwt-secret-0123456789abcdef
          PROMPTCODE_SANDBOX_EXECUTOR_TOKEN: ci-sandbox-secret-0123456789
          PROMPTCODE_OPENAI_API_KEY: ci-openai-key
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/merged-prod-compose.yml
          if grep -Eq 'published: "(8000|5433)"|^[[:space:]]+build:' /tmp/merged-prod-compose.yml; then
            echo "Merged production compose still exposes dev ports or build contexts." >&2
            grep -En 'published: "(8000|5433)"|^[[:space:]]+build:' /tmp/merged-prod-compose.yml >&2 || true
            exit 1
          fi

      - name: Build backend Docker image
        run: docker build -f docker/Dockerfile.backend .

      - name: Build sandbox Docker image
        run: docker build -f docker/Dockerfile.sandbox .

  compose-startup-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Rehearse startup graph without workers
        run: bash scripts/rehearse-compose-startup.sh

  deploy:
    name: Push image to ghcr.io
    runs-on: ubuntu-latest
    needs: [backend-tests, schema-drift, docker-build, compose-startup-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: promptcode-production-deploy
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_TIMEOUT: 2m
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${BASE}/backend" >> $GITHUB_ENV
          echo "SANDBOX_IMAGE_NAME=${BASE}/sandbox" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.SANDBOX_IMAGE_NAME }}:latest
            ${{ env.SANDBOX_IMAGE_NAME }}:${{ github.sha }}

      - name: Check SSH reachability
        id: check_ssh
        if: env.DEPLOY_HOST != ''
        continue-on-error: true
        run: |
          echo "Probing ${{ secrets.DEPLOY_HOST }}:22 ..."
          for i in $(seq 1 12); do
            if nc -z -w5 "${{ secrets.DEPLOY_HOST }}" 22 2>/dev/null; then
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              echo "SSH is reachable."
              exit 0
            fi
            echo "Attempt $i/12: port 22 not ready, retrying in 5s..."
            sleep 5
          done
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Deploy host unreachable after 60s — deploy steps will be skipped. Images were pushed to GHCR successfully."

      - name: Skip deploy notice
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable != 'true'
        run: echo "Host is not reachable. Image push succeeded; deploy skipped."

      - name: Sync compose and config files to host
        id: sync_host
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker/Caddyfile.prod,scripts/backup-db.sh,scripts/restore-db.sh,scripts/seed-prod-data.sh,scripts/check-prod-health.sh,scripts/validate-host-env.sh,scripts/setup-ghcr-login.sh,scripts/validate-prod-host.sh"
          target: "/opt/promptcode"

      - name: Deploy to production host
        id: deploy_host
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          script: |
            cd /opt/promptcode
            bash /opt/promptcode/scripts/validate-prod-host.sh
            bash /opt/promptcode/scripts/setup-ghcr-login.sh
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker pull ${{ env.SANDBOX_IMAGE_NAME }}:${{ github.sha }}
            docker tag ${{ env.SANDBOX_IMAGE_NAME }}:${{ github.sha }} promptcode-sandbox:latest
            # Record previous deployment tag before overwriting (for rollback reference)
            [ -f /opt/promptcode/.current-image-tag ] && cp /opt/promptcode/.current-image-tag /opt/promptcode/.previous-image-tag || true
            echo "${{ github.sha }}" > /opt/promptcode/.current-image-tag
            printf 'deploying %s %s\n' "$(date -u +%s)" "${{ github.sha }}" > /opt/promptcode/.last-deploy-status
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
            # Smart image cleanup: keep current SHA, previous SHA, and :latest; prune the rest
            PREV_TAG="$(cat /opt/promptcode/.previous-image-tag 2>/dev/null || echo 'NO_PREVIOUS')"
            for IMG in "${{ env.IMAGE_NAME }}" "${{ env.SANDBOX_IMAGE_NAME }}"; do
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep "^${IMG}:" \
                | grep -v ":latest$" \
                | grep -v ":${{ github.sha }}$" \
                | grep -v ":${PREV_TAG}$" \
                | xargs -r docker rmi 2>/dev/null || true
            done
            docker image prune -f
            echo "Waiting for /ready..."
            READY=false
            for i in $(seq 1 24); do
              if docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()" 2>/dev/null; then
                echo "App is healthy."
                READY=true
                break
              fi
              echo "Not ready yet ($i/24), sleeping 5s..."
              sleep 5
            done
            if [ "$READY" != "true" ]; then
              echo "ERROR: App did not become ready within 120s." >&2
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 backend
              exit 1
            fi
            echo "Deploy complete."

      - name: Seed production challenge data
        id: seed_challenges
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          command_timeout: 3m
          script: |
            bash /opt/promptcode/scripts/seed-prod-data.sh

      - name: Post-deploy smoke test
        id: smoke_test
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          command_timeout: 3m
          script: |
            docker compose -f /opt/promptcode/docker-compose.yml -f /opt/promptcode/docker-compose.prod.yml \
              exec -T \
              -e HOST_IP='${{ secrets.DEPLOY_HOST }}' \
              backend python -m scripts.run_deploy_smoke \
              --base-url http://127.0.0.1:8000 \
              --sandbox-executor-url http://sandbox-executor:8090
            printf 'success %s %s\n' "$(date -u +%s)" "${{ github.sha }}" > /opt/promptcode/.last-deploy-status
            echo "Smoke test passed."

      - name: Verify backend and db ports are not exposed on host
        id: verify_host_ports
        if: env.DEPLOY_HOST != '' && steps.check_ssh.outputs.reachable == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/tmp/promptcode-direct-backend.out 2>/tmp/promptcode-direct-backend.err; then
              echo "Backend port 8000 is still reachable from the host." >&2
              cat /tmp/promptcode-direct-backend.out >&2 || true
              exit 1
            fi
            if ! grep -qi "connection refused" /tmp/promptcode-direct-backend.err; then
              echo "Expected connection refused when probing host port 8000." >&2
              cat /tmp/promptcode-direct-backend.err >&2 || true
              exit 1
            fi
            echo "Direct host access to backend port 8000 is refused."
            if command -v nc >/dev/null 2>&1; then
              if nc -z -w 3 127.0.0.1 5433; then
                echo "Database port 5433 is still reachable from the host." >&2
                exit 1
              fi
            else
              python3 -c "import socket, sys; s=socket.socket(); s.settimeout(3); rc=s.connect_ex(('127.0.0.1', 5433)); s.close(); sys.exit(1 if rc == 0 else 0)"
            fi
            echo "Direct host access to database port 5433 is refused."

      - name: Roll back failed deploy
        if: >
          failure() &&
          env.DEPLOY_HOST != '' &&
          steps.sync_host.outcome == 'success' &&
          (
            steps.deploy_host.outcome == 'failure' ||
            steps.seed_challenges.outcome == 'failure' ||
            steps.smoke_test.outcome == 'failure' ||
            steps.verify_host_ports.outcome == 'failure'
          )
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: ${{ env.DEPLOY_SSH_TIMEOUT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/promptcode
            bash /opt/promptcode/scripts/validate-host-env.sh
            bash /opt/promptcode/scripts/setup-ghcr-login.sh
            if [ ! -f /opt/promptcode/.previous-image-tag ]; then
              echo "No previous deployment tag available for automatic rollback." >&2
              exit 1
            fi
            ROLLBACK_TAG="$(cat /opt/promptcode/.previous-image-tag)"
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "Recorded rollback tag is empty." >&2
              exit 1
            fi
            echo "Rolling back deployment to ${ROLLBACK_TAG}."
            echo "If the failed deploy already ran Alembic migrations, downgrade one revision before relying on the old image."
            docker pull ${{ env.IMAGE_NAME }}:${ROLLBACK_TAG}
            docker pull ${{ env.SANDBOX_IMAGE_NAME }}:${ROLLBACK_TAG}
            docker tag ${{ env.SANDBOX_IMAGE_NAME }}:${ROLLBACK_TAG} promptcode-sandbox:latest
            IMAGE_TAG="$ROLLBACK_TAG" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
            echo "$ROLLBACK_TAG" > /opt/promptcode/.current-image-tag
            printf 'rolled_back %s %s\n' "$(date -u +%s)" "$ROLLBACK_TAG" > /opt/promptcode/.last-deploy-status
            echo "Rollback completed to ${ROLLBACK_TAG}."
