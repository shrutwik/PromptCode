<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="PromptCode">
  <title>PromptCode</title>
  <!-- Solid ink plate. At 16px a thin outline plus a fine glyph turns to mud,
       so the shape is carried by the plate and only two bold forms are knocked
       out of it: the chevron and the underscore from the wordmark. -->
  <rect width="24" height="24" rx="5.5" fill="#eeece5"/>
  <rect x="2.4" y="2.4" width="19.2" height="19.2" rx="4.6" fill="#11110f"/>
  <path d="M8.2 8.1l5.1 3.9-5.1 3.9" fill="none" stroke="#eeece5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.6 16.2h3.1" fill="none" stroke="#eeece5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
