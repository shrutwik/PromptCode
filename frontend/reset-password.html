<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — PromptCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap">
<link rel="stylesheet" href="/static/css/pc-tokens.css?v=20260930">
<link rel="stylesheet" href="/static/css/pc-components.css?v=20261001e">
<style>
.pc-auth-card > .pc-alert { margin-bottom: var(--pc-space-4); }
.pw-hint { font-size: var(--pc-text-xs); color: var(--pc-muted); margin: -8px 0 var(--pc-space-5); }
.ss-tagline { text-align: center; margin-top: 20px; font-size: var(--pc-text-sm); color: var(--pc-muted); }
.ss-tagline strong { color: var(--pc-text); font-weight: 500; }
</style>
</head>
<body class="pc-public">
<a class="pc-skip" href="#main">Skip to content</a>
<header data-pc-header></header>

<main class="pc-main pc-auth" id="main">
  <div class="pc-auth-form">
    <div class="pc-auth-card">
      <p class="pc-eyebrow">Reset password</p>
      <h1>Choose a new password.</h1>
      <p class="page-lead">Use the token from your reset instructions.</p>

      <div class="pc-alert" data-tone="danger" role="alert" id="resetError" hidden></div>
      <div class="pc-alert" data-tone="success" role="status" id="resetNotice" hidden></div>

      <form id="resetForm" novalidate>
        <div class="pc-field">
          <label for="token">Reset token</label>
          <input type="text" id="token" autocomplete="one-time-code" required>
        </div>
        <div class="pc-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required>
        </div>
        <p class="pw-hint">At least 12 characters, with upper, lower, number, and symbol.</p>
        <div class="pc-field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block btn-submit">Update password</button>
      </form>

      <p class="pc-auth-foot"><a href="/login.html">Back to sign in</a></p>
    </div>
  </div>

  <aside class="pc-auth-aside" aria-label="Reset help">
    <div class="ss">
      <p class="ss-tagline">The reset link expires in one hour<br><strong>and works only once.</strong></p>
    </div>
  </aside>
</main>

<footer data-pc-footer></footer>

<script src="/static/api.js?v=20261001j"></script>
<script src="/static/js/pc-ui.js?v=20261002a"></script>
<script src="/static/reset-password.js?v=20261001j"></script>
</body>
</html>
