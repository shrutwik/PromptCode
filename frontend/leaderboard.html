<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — PromptCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a09; --surface: #111110; --surface2: #141412;
  --border: #1f1f1d; --border-light: #2a2a27;
  --text: #e8e6e0; --muted: #6b6b65;
  --accent: #c8f060; --accent-dim: rgba(200,240,96,0.10);
  --warn: #f0a060; --danger: #f06060; --success: #60d4a8;
  --radius: 6px; --nav-h: 52px;
}
body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #2a2a27; border-radius: 3px; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes countUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.fade-in{animation:fadeUp 0.4s ease both} .d1{animation-delay:.06s;opacity:0} .d2{animation-delay:.12s;opacity:0} .d3{animation-delay:.18s;opacity:0} .d4{animation-delay:.24s;opacity:0} .d5{animation-delay:.30s;opacity:0}

nav { position:fixed; top:0; left:0; right:0; z-index:100; height:var(--nav-h); display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--border); background:rgba(10,10,9,0.94); backdrop-filter:blur(16px); }
.nav-logo { display:flex; align-items:center; gap:8px; font-family:'Instrument Serif',serif; font-size:18px; letter-spacing:-0.02em; color:var(--text); text-decoration:none; }
.nav-logo .dot { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:pulse 2.4s ease-in-out infinite; }
.nav-links { display:flex; gap:24px; }
.nav-links a { color:var(--muted); text-decoration:none; font-size:12px; letter-spacing:0.04em; transition:color 0.2s; }
.nav-links a:hover { color:var(--text); } .nav-links a.active { color:var(--text); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:var(--radius); font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; transition:all 0.15s; text-decoration:none; border:1px solid transparent; }
.btn-ghost { background:transparent; border-color:var(--border-light); color:var(--muted); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-primary { background:var(--accent); color:var(--bg); font-weight:500; }
.btn-primary:hover { background:#d4f870; }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: calc(var(--nav-h) + 40px) 32px 60px; }

/* HERO ROW */
.lb-hero { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 40px; }
.podium-card {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface2); padding: 24px 20px;
  text-align: center; position: relative; overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.podium-card:hover { transform: translateY(-2px); }
.podium-card.first { border-color: rgba(240,192,96,0.4); background: rgba(240,192,96,0.04); order: 2; }
.podium-card.second { border-color: rgba(168,184,200,0.3); order: 1; }
.podium-card.third { border-color: rgba(200,120,64,0.3); order: 3; }

.podium-medal { font-size: 24px; margin-bottom: 10px; }
.podium-avatar {
  width: 48px; height: 48px; border-radius: 10px;
  background: var(--border-light); margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--muted);
}
.podium-card.first .podium-avatar { background: rgba(240,192,96,0.15); color: #f0c060; }
.podium-name { font-size: 14px; color: var(--text); margin-bottom: 4px; }
.podium-score { font-family: 'Instrument Serif', serif; font-size: 32px; color: var(--accent); line-height: 1; margin-bottom: 6px; }
.podium-meta { font-size: 11px; color: var(--muted); }
.podium-rank { position: absolute; top: 14px; right: 14px; font-family: 'Instrument Serif', serif; font-size: 48px; color: rgba(255,255,255,0.04); line-height: 1; }

/* TABS + FILTERS */
.table-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tab-pill { padding: 5px 14px; border: 1px solid var(--border-light); border-radius: 20px; font-size: 11px; color: var(--muted); cursor: pointer; transition: all 0.15s; background: transparent; font-family: 'DM Mono', monospace; }
.tab-pill:hover { border-color: var(--text); color: var(--text); }
.tab-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.challenge-select { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 5px 10px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); outline: none; cursor: pointer; margin-left: auto; }

/* TABLE */
.lb-table { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface2); }
.lb-header { display: grid; grid-template-columns: 52px 1fr 80px 80px 80px 80px 80px; gap: 12px; padding: 10px 20px; font-size: 10px; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--surface); }
.lb-row {
  display: grid; grid-template-columns: 52px 1fr 80px 80px 80px 80px 80px;
  gap: 12px; align-items: center; padding: 13px 20px;
  border-bottom: 1px solid var(--border); transition: background 0.12s;
}
.lb-row:last-child { border-bottom: none; }
.lb-row:hover { background: rgba(255,255,255,0.02); }
.lb-row.you { background: rgba(200,240,96,0.04); border-left: 2px solid var(--accent); padding-left: 18px; }

.rank-num { font-size: 12px; color: var(--muted); font-family: 'Instrument Serif', serif; font-size: 16px; }
.rank-num.r1 { color: #f0c060; }
.rank-num.r2 { color: #a8b8c8; }
.rank-num.r3 { color: #c87840; }

.user-cell { display: flex; align-items: center; gap: 10px; }
.user-ava { width: 28px; height: 28px; border-radius: 5px; background: var(--border-light); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); flex-shrink: 0; }
.user-ava.you { background: var(--accent-dim); border: 1px solid rgba(200,240,96,0.3); color: var(--accent); }
.user-handle { font-size: 12px; color: var(--text); }
.user-badge { font-size: 9px; padding: 1px 5px; border-radius: 2px; background: var(--accent-dim); color: var(--accent); margin-left: 4px; }
.user-streak { font-size: 10px; color: var(--muted); }

.cell-score { font-size: 13px; color: var(--accent); text-align: right; }
.cell-val { font-size: 12px; color: var(--text); text-align: right; }
.cell-muted { font-size: 12px; color: var(--muted); text-align: right; }

.mini-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.mini-bar { width: 40px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 2px; background: var(--accent); }

/* YOUR STATS ASIDE */
.page-grid { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: start; }

.your-stats { position: sticky; top: calc(var(--nav-h) + 20px); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - var(--nav-h) - 40px); overflow-y: auto; padding-right: 4px; }
.stats-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); overflow: hidden; }
.stats-card-hdr { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 10px; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.stats-card-body { padding: 14px; }
.sc-metric { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.sc-metric:last-child { border-bottom: none; }
.sc-mk { color: var(--muted); }
.sc-mv { color: var(--text); }
.sc-mv.ac { color: var(--accent); }

.diff-badge { font-size: 9px; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.05em; }
.diff-easy { background: rgba(96,212,168,0.15); color: var(--success); }
.diff-med { background: rgba(240,160,96,0.15); color: var(--warn); }
.diff-hard { background: rgba(240,96,96,0.15); color: var(--danger); }

.recent-sub { display: flex; flex-direction: column; gap: 1px; }
.sub-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
.sub-item:last-child { border-bottom: none; }
.sub-name { color: var(--text); }
.sub-score { color: var(--accent); }
.sub-time { color: var(--muted); font-size: 10px; }

@media (max-width: 960px) {
  nav { padding: 0 16px; }
  .nav-links { display: none; }
  .page-wrap { padding: calc(var(--nav-h) + 24px) 16px 40px; }
  .lb-hero,
  .page-grid { grid-template-columns: 1fr; }
  .your-stats {
    position: static;
    top: auto;
    max-height: none;
    overflow: visible;
    padding-right: 0;
  }
  .lb-table {
    overflow-x: auto;
    overflow-y: hidden;
  }
  .lb-header,
  .lb-row { min-width: 720px; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/index.html"><div class="dot"></div>PromptCode</a>
  <div class="nav-links">
    <a href="/challenges.html">challenges</a>
    <a href="/leaderboard.html" class="active">leaderboard</a>
    <a href="/playground.html">playground</a>
  </div>
  <div class="nav-right">
    <a class="btn btn-primary" href="/challenges.html">start solving →</a>
    <a data-noauth-show class="btn btn-ghost" href="/login.html">sign in</a>
    <a data-auth-show href="/profile.html" style="width:28px;height:28px;border-radius:5px;background:var(--accent-dim);border:1px solid rgba(200,240,96,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);cursor:pointer;margin-left:4px;text-decoration:none" data-user-initials>jl</a>
  </div>
</nav>

<div class="page-wrap">

  <div style="margin-bottom:32px" class="fade-in">
    <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px">global rankings</div>
    <h1 style="font-family:'Instrument Serif',serif;font-size:36px;letter-spacing:-0.02em;margin-bottom:4px">Leaderboard</h1>
    <div style="font-size:12px;color:var(--muted)"><span id="lb-count">—</span> engineers ranked by overall efficiency score · updated every submission</div>
  </div>

  <!-- PODIUM -->
  <div id="podium-container" class="lb-hero fade-in d1" style="display:flex;gap:20px">
    <div style="flex:1;text-align:center;padding:40px 0;color:var(--muted);font-size:12px">Loading top performers…</div>
  </div>

  <div class="page-grid">
    <!-- TABLE -->
    <div>
      <div class="table-controls fade-in d2">
        <select id="challenge-select" class="challenge-select">
          <option value="">loading challenges…</option>
        </select>
      </div>

      <div id="lb-table" class="lb-table fade-in d3">
        <div class="lb-header">
          <span>rank</span>
          <span>engineer</span>
          <span style="text-align:right">score</span>
          <span style="text-align:right">accuracy</span>
          <span style="text-align:right">efficiency</span>
          <span style="text-align:right">calls</span>
          <span style="text-align:right">cost</span>
        </div>
        <div id="lb-rows" style="min-height:60px">
          <div style="text-align:center;padding:20px 0;color:var(--muted);font-size:12px;grid-column:1/-1">Loading…</div>
        </div>
      </div>
      <div id="lb-footer" style="text-align:center;padding:16px 0;font-size:11px;color:var(--muted)"></div>
    </div>

    <!-- YOUR STATS -->
    <div id="sidebar" class="your-stats fade-in d4"></div>
  </div>

</div>

<script src="/static/api.js"></script>
<script>
(function() {
  const $ = id => document.getElementById(id);
  const initials = name => (name || '??').substring(0, 2).toLowerCase();
  const fmt = (v, d = 2) => v != null ? Number(v).toFixed(d) : '—';
  const fmtCost = v => v != null ? '$' + Number(v).toFixed(2) : '—';
  const rankClass = r => r === 1 ? 'r1' : r === 2 ? 'r2' : r === 3 ? 'r3' : '';
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const podiumOrder = { 1: 'first', 2: 'second', 3: 'third' };

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function renderPodium(entries) {
    const container = $('podium-container');
    if (!entries || entries.length === 0) {
      container.innerHTML = '<div style="flex:1;text-align:center;padding:40px 0;color:var(--muted);font-size:12px">No entries yet — be the first!</div>';
      return;
    }
    const top3 = entries.slice(0, 3);
    const order = [2, 1, 3];
    container.innerHTML = order.map(pos => {
      const e = top3[pos - 1];
      if (!e) return '';
      const cls = podiumOrder[pos] || '';
      const isFirst = pos === 1;
      const avatarStyle = isFirst ? ' style="width:56px;height:56px;font-size:18px"' : '';
      const cardStyle = isFirst ? ' style="flex:1;margin-top:-12px"' : ' style="flex:1"';
      return `<div class="podium-card ${cls} fade-in d${pos}"${cardStyle}>
        <div class="podium-rank">${pos}</div>
        <div class="podium-medal">${medals[pos]}</div>
        <div class="podium-avatar"${avatarStyle}>${initials(e.username)}</div>
        <div class="podium-name">${e.username}</div>
        <div class="podium-score">${fmt(e.score_overall)}</div>
        <div class="podium-meta">${fmtCost(e.total_cost_usd)} cost · ${e.total_llm_calls || 0} calls</div>
      </div>`;
    }).join('');
  }

  function renderTable(entries) {
    const rows = $('lb-rows');
    const footer = $('lb-footer');
    const currentUser = PromptCodeAPI.getUser();
    const currentUsername = currentUser ? currentUser.username : null;

    if (!entries || entries.length === 0) {
      rows.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--muted);font-size:12px;grid-column:1/-1">No leaderboard entries yet</div>';
      footer.textContent = '';
      return;
    }

    rows.innerHTML = entries.map(e => {
      const isYou = currentUsername && e.username === currentUsername;
      const rowCls = isYou ? 'lb-row you' : 'lb-row';
      const rc = rankClass(e.rank);
      const rankStyle = rc ? '' : ' style="color:var(--muted)"';
      const rankEl = isYou
        ? `<span class="rank-num" style="color:var(--accent);font-family:'DM Mono',monospace;font-size:12px">${e.rank}</span>`
        : `<span class="rank-num ${rc}"${rankStyle}>${e.rank}</span>`;
      const avaCls = isYou ? 'user-ava you' : 'user-ava';
      const handleStyle = isYou ? ' style="color:var(--accent)"' : '';
      const badge = isYou ? ' <span class="user-badge">you</span>' : (e.rank === 1 ? ' <span class="user-badge">top 1%</span>' : '');
      const pct = Math.round((e.score_overall || 0) * 100);
      const barBg = isYou ? 'background:var(--accent)' : '';

      return `<div class="${rowCls}">
        ${rankEl}
        <div class="user-cell"><div class="${avaCls}">${initials(e.username)}</div><div><div class="user-handle"${handleStyle}>${e.username}${badge}</div></div></div>
        <div class="mini-bar-wrap"><div class="mini-bar"><div class="mini-fill" style="width:${pct}%;${barBg}"></div></div><span class="cell-score">${fmt(e.score_overall)}</span></div>
        <span class="cell-val">${fmt(e.score_accuracy)}</span>
        <span class="cell-val">${fmt(e.score_efficiency)}</span>
        <span class="cell-val">${e.total_llm_calls ?? '—'}</span>
        <span class="cell-muted">${fmtCost(e.total_cost_usd)}</span>
      </div>`;
    }).join('');

    footer.textContent = `showing ${entries.length} entries`;
  }

  function renderSidebar(profile) {
    const sidebar = $('sidebar');
    if (!PromptCodeAPI.isLoggedIn()) {
      sidebar.innerHTML = `
        <div class="stats-card">
          <div class="stats-card-hdr">your stats</div>
          <div class="stats-card-body" style="text-align:center;padding:24px 14px;color:var(--muted);font-size:12px">
            <a href="/login.html" class="btn btn-ghost" style="margin-bottom:8px">sign in</a> to see your stats
          </div>
        </div>
        <a class="btn btn-primary" href="/challenges.html" style="text-align:center;justify-content:center">attempt a challenge →</a>`;
      return;
    }

    if (!profile) {
      sidebar.innerHTML = `
        <div class="stats-card">
          <div class="stats-card-hdr">your stats</div>
          <div class="stats-card-body" style="text-align:center;padding:24px 14px;color:var(--muted);font-size:12px">Loading…</div>
        </div>`;
      return;
    }

    const s = profile.stats || {};
    const subs = profile.recent_submissions || [];

    const effColor = (s.avg_efficiency != null && s.avg_efficiency < 0.75) ? 'color:var(--warn)' : '';

    sidebar.innerHTML = `
      <div class="stats-card">
        <div class="stats-card-hdr">
          your stats
          <span style="color:var(--accent);font-family:'Instrument Serif',serif;font-size:16px">${fmt(s.avg_score)}</span>
        </div>
        <div class="stats-card-body">
          <div class="sc-metric"><span class="sc-mk">challenges solved</span><span class="sc-mv">${s.challenges_solved ?? 0} / ${s.total_challenges ?? '—'}</span></div>
          <div class="sc-metric"><span class="sc-mk">avg accuracy</span><span class="sc-mv">${fmt(s.avg_accuracy)}</span></div>
          <div class="sc-metric"><span class="sc-mk">avg efficiency</span><span class="sc-mv" style="${effColor}">${fmt(s.avg_efficiency)}</span></div>
          <div class="sc-metric"><span class="sc-mk">avg orchestration</span><span class="sc-mv">${fmt(s.avg_orchestration)}</span></div>
          <div class="sc-metric"><span class="sc-mk">avg reliability</span><span class="sc-mv">${fmt(s.avg_reliability)}</span></div>
          <div class="sc-metric"><span class="sc-mk">total cost</span><span class="sc-mv">${fmtCost(s.total_cost_usd)}</span></div>
          <div class="sc-metric"><span class="sc-mk">total submissions</span><span class="sc-mv">${s.total_submissions ?? 0}</span></div>
        </div>
      </div>

      <div class="stats-card">
        <div class="stats-card-hdr">recent submissions</div>
        <div class="stats-card-body" style="padding:8px 14px">
          <div class="recent-sub">
            ${subs.length === 0
              ? '<div style="text-align:center;padding:12px 0;color:var(--muted);font-size:11px">no submissions yet</div>'
              : subs.map(sub => `<div class="sub-item">
                  <div><div class="sub-name">${sub.challenge_title || sub.challenge_id || '—'}</div><div class="sub-time">${timeAgo(sub.created_at)}</div></div>
                  <span class="sub-score">${fmt(sub.score_overall)}</span>
                </div>`).join('')}
          </div>
        </div>
      </div>

      <a class="btn btn-primary" href="/challenges.html" style="text-align:center;justify-content:center">attempt a challenge →</a>`;
  }

  async function loadLeaderboard(challengeId) {
    if (!challengeId) {
      $('lb-count').textContent = '0';
      renderPodium([]);
      renderTable([]);
      return;
    }
    try {
      const entries = await PromptCodeAPI.getLeaderboard(challengeId);
      const list = Array.isArray(entries) ? entries : (entries.entries || entries.leaderboard || []);
      $('lb-count').textContent = list.length;
      renderPodium(list);
      renderTable(list);
    } catch (err) {
      console.error('Leaderboard load failed:', err);
      $('lb-count').textContent = '0';
      renderPodium([]);
      renderTable([]);
    }
  }

  async function loadSidebar() {
    if (!PromptCodeAPI.isLoggedIn()) {
      renderSidebar(null);
      return;
    }
    renderSidebar(null);
    try {
      const user = PromptCodeAPI.getUser();
      const profile = await PromptCodeAPI.getUserProfile(user.username);
      renderSidebar(profile);
    } catch (err) {
      console.error('Profile load failed:', err);
      const sidebar = $('sidebar');
      sidebar.innerHTML = `
        <div class="stats-card">
          <div class="stats-card-hdr">your stats</div>
          <div class="stats-card-body" style="text-align:center;padding:24px 14px;color:var(--muted);font-size:12px">Could not load stats</div>
        </div>
        <a class="btn btn-primary" href="/challenges.html" style="text-align:center;justify-content:center">attempt a challenge →</a>`;
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    PromptCodeAPI.updateNavAuth();

    const select = $('challenge-select');
    const params = new URLSearchParams(window.location.search);
    const requestedChallengeId = params.get('id') || params.get('challenge_id');

    try {
      const challenges = await PromptCodeAPI.getChallenges();
      const list = Array.isArray(challenges) ? challenges : (challenges.challenges || []);
      select.innerHTML = '';
      if (list.length === 0) {
        select.innerHTML = '<option value="">no challenges available</option>';
      } else {
        list.forEach((c, i) => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.title || c.name || c.id;
          select.appendChild(opt);
        });
      }

      select.addEventListener('change', async () => {
        const nextId = select.value || '';
        const url = new URL(window.location.href);
        if (nextId) url.searchParams.set('id', nextId);
        else url.searchParams.delete('id');
        history.replaceState(null, '', url.toString());
        await loadLeaderboard(nextId);
      });

      if (list.length > 0) {
        if (requestedChallengeId && list.some(c => c.id === requestedChallengeId)) {
          select.value = requestedChallengeId;
        }
        await loadLeaderboard(select.value);
      } else {
        $('lb-count').textContent = '0';
        renderPodium([]);
        renderTable([]);
      }
    } catch (err) {
      console.error('Failed to load challenges:', err);
      select.innerHTML = '<option value="">failed to load</option>';
      $('lb-count').textContent = '0';
      renderPodium([]);
      renderTable([]);
    }

    loadSidebar();
  });
})();
</script>
</body>
</html>
