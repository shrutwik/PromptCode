<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — PromptCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap">
<link rel="stylesheet" href="/static/css/pc-tokens.css?v=20260930">
<link rel="stylesheet" href="/static/css/pc-components.css?v=20261001e">
<style>
.lb-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.lb-grid > * { min-width: 0; }
.lb-filters { flex-wrap: nowrap; }
.lb-filters label { font-size: var(--pc-text-sm); color: var(--pc-muted); padding: 0 4px 0 6px; flex-shrink: 0; }
.lb-filters select { flex: 0 1 360px; min-width: 0; text-overflow: ellipsis; }
.lb-filters .lb-meta { margin-left: auto; padding-right: 6px; font-size: var(--pc-text-xs); color: var(--pc-faint); font-family: var(--pc-font-mono); }

.lb-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: var(--pc-space-4); }
.lb-podium[hidden] { display: none; }
.lb-pod { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.lb-pod.is-first { border-color: var(--pc-border-strong); }
.lb-pod-rank { font-family: var(--pc-font-mono); font-size: var(--pc-text-sm); color: var(--pc-faint); width: 22px; }
.lb-pod-name { font-weight: 500; color: var(--pc-text); font-size: var(--pc-text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-pod-meta { font-size: var(--pc-text-xs); color: var(--pc-muted); }
.lb-pod-score { margin-left: auto; font-family: var(--pc-font-mono); font-size: 1.25rem; color: var(--pc-text); font-variant-numeric: tabular-nums; }

.lb-user { display: flex; align-items: center; gap: 10px; }
.lb-user strong { font-weight: 500; color: var(--pc-text); }
.pc-table tr.is-you td { background: var(--pc-accent-dim); }
.pc-table tr.is-you td:first-child { box-shadow: inset 2px 0 0 var(--pc-accent); }
.lb-score { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.lb-score .pc-bar { width: 44px; height: 4px; }
.lb-foot { text-align: center; padding: 12px 0 0; font-size: var(--pc-text-xs); color: var(--pc-faint); }

.lb-side { position: sticky; top: calc(var(--pc-header-h) + 20px); display: grid; gap: 12px; }
.lb-metric { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--pc-border); font-size: var(--pc-text-sm); }
.lb-metric:last-child { border-bottom: 0; }
.lb-metric span { color: var(--pc-muted); }
.lb-metric b { font-weight: 500; font-family: var(--pc-font-mono); color: var(--pc-text); font-variant-numeric: tabular-nums; }
.lb-metric b.is-warn { color: var(--pc-warn); }
.lb-sub { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--pc-border); font-size: var(--pc-text-sm); }
.lb-sub:last-child { border-bottom: 0; }
.lb-sub small { display: block; font-size: var(--pc-text-xs); color: var(--pc-faint); }
.lb-sub b { font-family: var(--pc-font-mono); font-weight: 500; color: var(--pc-text); }
.lb-side-empty { text-align: center; color: var(--pc-muted); font-size: var(--pc-text-sm); }
.lb-side-empty .btn { margin-bottom: 8px; }

@media (max-width: 960px) {
  .lb-grid { grid-template-columns: 1fr; }
  .lb-side { position: static; }
  .lb-podium { grid-template-columns: 1fr; }
  .lb-table-wrap { overflow-x: auto; }
  .lb-table-wrap .pc-table { min-width: 640px; }
  .lb-filters select { flex: 1 1 0; }
  .lb-filters .lb-meta { display: none; }
}
</style>
</head>
<body class="pc-public">
<a class="pc-skip" href="#main">Skip to content</a>
<header data-pc-header></header>

<main class="pc-main" id="main">
  <div class="page">
    <div class="page-head">
      <div>
        <p class="pc-eyebrow">Global rankings</p>
        <h1 class="page-title">Leaderboard</h1>
        <p class="page-lead"><span id="lb-count">—</span> engineers ranked by overall efficiency score · updated every submission</p>
      </div>
    </div>

    <div class="lb-grid">
      <div>
        <div class="filters lb-filters">
          <label for="challenge-select">Challenge</label>
          <select id="challenge-select">
            <option value="">Loading challenges…</option>
          </select>
          <span class="lb-meta" id="lb-footer" aria-live="polite"></span>
        </div>

        <div id="podium-container" class="lb-podium" hidden data-stagger></div>

        <div id="lb-table" class="pc-table-wrap lb-table-wrap">
          <table class="pc-table">
            <thead>
              <tr>
                <th scope="col">Rank</th>
                <th scope="col">Engineer</th>
                <th scope="col" class="num">Score</th>
                <th scope="col" class="num">Accuracy</th>
                <th scope="col" class="num">Efficiency</th>
                <th scope="col" class="num">Calls</th>
                <th scope="col" class="num">Cost</th>
              </tr>
            </thead>
            <tbody id="lb-rows" data-stagger>
              <tr><td colspan="7"><span class="pc-skeleton pc-skeleton-text"></span><span class="pc-skeleton pc-skeleton-text" style="--w:60%"></span></td></tr>
            </tbody>
          </table>
        </div>
        <div id="lb-empty" class="pc-empty" hidden>
          <h3>No entries yet</h3>
          <p>Nobody has submitted to this challenge yet — be the first on the board.</p>
          <a class="btn btn-primary" href="/challenges.html">Attempt a challenge</a>
        </div>
      </div>

      <aside id="sidebar" class="lb-side" aria-label="Your stats"></aside>
    </div>
  </div>
</main>

<footer data-pc-footer></footer>

<script src="/static/api.js"></script>
<script src="/static/js/pc-ui.js?v=20261002a"></script>
<script src="/static/js/pages/leaderboard.js?v=20260930"></script>
</body>
</html>
