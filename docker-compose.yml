services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptcode
      POSTGRES_PASSWORD: promptcode
      POSTGRES_DB: promptcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptcode"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    image: promptcode-sandbox:latest
    entrypoint: ["echo", "sandbox image built"]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Use the same database URL as configured in your .env.
      # For Supabase, set PROMPTCODE_DATABASE_URL in .env to your Supabase Postgres URI
      # (e.g. postgresql+asyncpg://<user>:<password>@<host>:5432/<db>?sslmode=require)
      PROMPTCODE_DATABASE_URL: ${PROMPTCODE_DATABASE_URL}
      PROMPTCODE_OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTCODE_SANDBOX_IMAGE: promptcode-sandbox:latest
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["python", "-m", "scripts.run_queue_worker"]
    environment:
      PROMPTCODE_DATABASE_URL: ${PROMPTCODE_DATABASE_URL}
      PROMPTCODE_OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTCODE_SANDBOX_IMAGE: promptcode-sandbox:latest
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
