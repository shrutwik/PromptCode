x-backend-env: &backend-env
  environment:
    PROMPTCODE_DATABASE_URL: "postgresql+asyncpg://${PROMPTCODE_DB_USER:-promptcode}:${PROMPTCODE_DB_PASSWORD:?set PROMPTCODE_DB_PASSWORD}@db:5432/${PROMPTCODE_DB_NAME:-promptcode}"
    PROMPTCODE_DATABASE_ECHO: ${PROMPTCODE_DATABASE_ECHO:-false}
    PROMPTCODE_DATABASE_SSL_REQUIRE: ${PROMPTCODE_DATABASE_SSL_REQUIRE:-false}
    PROMPTCODE_DATABASE_SSL_CA_FILE: ${PROMPTCODE_DATABASE_SSL_CA_FILE:-}
    PROMPTCODE_OPENAI_API_KEY: ${PROMPTCODE_OPENAI_API_KEY:-}
    PROMPTCODE_OPENAI_BASE_URL: ${PROMPTCODE_OPENAI_BASE_URL:-}
    PROMPTCODE_OPENAI_MODEL: ${PROMPTCODE_OPENAI_MODEL:-gpt-4o}
    PROMPTCODE_PROMPT_JUDGE_MODEL: ${PROMPTCODE_PROMPT_JUDGE_MODEL:-gpt-4o}
    PROMPTCODE_PROMPT_JUDGE_FALLBACK_MODEL: ${PROMPTCODE_PROMPT_JUDGE_FALLBACK_MODEL:-gpt-4o}
    PROMPTCODE_JWT_SECRET: ${PROMPTCODE_JWT_SECRET:?set PROMPTCODE_JWT_SECRET}
    PROMPTCODE_DEBUG: ${PROMPTCODE_DEBUG:-false}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_PATH: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_PATH:-}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_LOCK_PATH: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_LOCK_PATH:-}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_ENFORCE_LOCK: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_ENFORCE_LOCK:-true}
    PROMPTCODE_SANDBOX_IMAGE: promptcode-sandbox:latest
    PROMPTCODE_SANDBOX_HOST_WORKDIR: ${PROMPTCODE_SANDBOX_HOST_WORKDIR:-/tmp/promptcode_sandbox_work}
    PROMPTCODE_SANDBOX_NETWORK_MODE: ${PROMPTCODE_SANDBOX_NETWORK_MODE:-container}
    PROMPTCODE_SANDBOX_TIMEOUT_SECONDS: ${PROMPTCODE_SANDBOX_TIMEOUT_SECONDS:-120}
    PROMPTCODE_SANDBOX_MEMORY_LIMIT: ${PROMPTCODE_SANDBOX_MEMORY_LIMIT:-512m}
    PROMPTCODE_SANDBOX_CPU_LIMIT: ${PROMPTCODE_SANDBOX_CPU_LIMIT:-1.0}
    PROMPTCODE_SANDBOX_EXECUTOR_URL: ${PROMPTCODE_SANDBOX_EXECUTOR_URL:-http://sandbox-executor:8090}
    PROMPTCODE_SANDBOX_EXECUTOR_TOKEN: ${PROMPTCODE_SANDBOX_EXECUTOR_TOKEN:?set PROMPTCODE_SANDBOX_EXECUTOR_TOKEN}
    PROMPTCODE_SANDBOX_EXECUTOR_MAX_CONCURRENT_RUNS: ${PROMPTCODE_SANDBOX_EXECUTOR_MAX_CONCURRENT_RUNS:-6}
    PROMPTCODE_SANDBOX_EXECUTOR_ACQUIRE_TIMEOUT_SECONDS: ${PROMPTCODE_SANDBOX_EXECUTOR_ACQUIRE_TIMEOUT_SECONDS:-10}
    PROMPTCODE_EVALUATION_NORMAL_RUNS: ${PROMPTCODE_EVALUATION_NORMAL_RUNS:-5}
    PROMPTCODE_EVALUATION_ADVERSARIAL_RUNS: ${PROMPTCODE_EVALUATION_ADVERSARIAL_RUNS:-2}
    PROMPTCODE_EVALUATION_MAX_PARALLEL_SPECS: ${PROMPTCODE_EVALUATION_MAX_PARALLEL_SPECS:-2}
    PROMPTCODE_EVALUATION_JOB_TIMEOUT_SECONDS: ${PROMPTCODE_EVALUATION_JOB_TIMEOUT_SECONDS:-1800}
    PROMPTCODE_SUBMISSION_INLINE_QUEUE_PROCESSING: ${PROMPTCODE_SUBMISSION_INLINE_QUEUE_PROCESSING:-false}
    PROMPTCODE_SUBMISSION_MAX_OUTSTANDING_JOBS_PER_USER: ${PROMPTCODE_SUBMISSION_MAX_OUTSTANDING_JOBS_PER_USER:-3}
    PROMPTCODE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${PROMPTCODE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
    PROMPTCODE_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${PROMPTCODE_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-30}
    PROMPTCODE_SENTRY_DSN: ${PROMPTCODE_SENTRY_DSN:-}
    DOMAIN: ${DOMAIN:-}

services:
  db:
    image: postgres:16.11-alpine3.23
    environment:
      POSTGRES_USER: ${PROMPTCODE_DB_USER:-promptcode}
      POSTGRES_PASSWORD: ${PROMPTCODE_DB_PASSWORD:?set PROMPTCODE_DB_PASSWORD}
      POSTGRES_DB: ${PROMPTCODE_DB_NAME:-promptcode}
    ports:
      - "${PROMPTCODE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROMPTCODE_DB_USER:-promptcode}"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    image: promptcode-sandbox:latest
    entrypoint: ["echo", "sandbox image built"]
    restart: "no"

  sandbox-executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["uvicorn", "app.sandbox_executor:app", "--host", "0.0.0.0", "--port", "8090"]
    user: "promptcode"
    # Grant Docker socket access without running as root.
    # Set DOCKER_GID to the host docker group GID: $(stat -c '%g' /var/run/docker.sock)
    # Default 999 matches most Linux distros; override in .env if different.
    group_add:
      - "${DOCKER_GID:-999}"
    <<: *backend-env
    restart: unless-stopped
    depends_on:
      sandbox:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROMPTCODE_SANDBOX_HOST_WORKDIR:-/tmp/promptcode_sandbox_work}:${PROMPTCODE_SANDBOX_HOST_WORKDIR:-/tmp/promptcode_sandbox_work}

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    <<: *backend-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sandbox-executor:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["python", "-m", "scripts.run_with_migrations", "python", "-m", "scripts.run_queue_worker"]
    <<: *backend-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sandbox-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker_health"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 20s

  worker-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["python", "-m", "scripts.run_with_migrations", "python", "-m", "scripts.run_queue_worker"]
    <<: *backend-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sandbox-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker_health"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
