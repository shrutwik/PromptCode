x-backend-env: &backend-env
  environment:
    PROMPTCODE_DATABASE_URL: postgresql+asyncpg://promptcode:promptcode@db:5432/promptcode
    PROMPTCODE_DATABASE_ECHO: ${PROMPTCODE_DATABASE_ECHO:-false}
    PROMPTCODE_DATABASE_SSL_REQUIRE: ${PROMPTCODE_DATABASE_SSL_REQUIRE:-false}
    PROMPTCODE_DATABASE_SSL_CA_FILE: ${PROMPTCODE_DATABASE_SSL_CA_FILE:-}
    PROMPTCODE_OPENAI_API_KEY: ${PROMPTCODE_OPENAI_API_KEY:-}
    PROMPTCODE_OPENAI_BASE_URL: ${PROMPTCODE_OPENAI_BASE_URL:-}
    PROMPTCODE_OPENAI_MODEL: ${PROMPTCODE_OPENAI_MODEL:-gpt-4o}
    PROMPTCODE_PROMPT_JUDGE_MODEL: ${PROMPTCODE_PROMPT_JUDGE_MODEL:-gpt-4o}
    PROMPTCODE_PROMPT_JUDGE_FALLBACK_MODEL: ${PROMPTCODE_PROMPT_JUDGE_FALLBACK_MODEL:-gpt-4o}
    PROMPTCODE_JWT_SECRET: ${PROMPTCODE_JWT_SECRET:-}
    PROMPTCODE_DEBUG: ${PROMPTCODE_DEBUG:-false}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_PATH: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_PATH:-}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_LOCK_PATH: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_LOCK_PATH:-}
    PROMPTCODE_EVALUATION_WEIGHT_PROFILE_ENFORCE_LOCK: ${PROMPTCODE_EVALUATION_WEIGHT_PROFILE_ENFORCE_LOCK:-true}
    PROMPTCODE_SANDBOX_IMAGE: promptcode-sandbox:latest
    PROMPTCODE_SANDBOX_TIMEOUT_SECONDS: ${PROMPTCODE_SANDBOX_TIMEOUT_SECONDS:-120}
    PROMPTCODE_SANDBOX_MEMORY_LIMIT: ${PROMPTCODE_SANDBOX_MEMORY_LIMIT:-512m}
    PROMPTCODE_SANDBOX_CPU_LIMIT: ${PROMPTCODE_SANDBOX_CPU_LIMIT:-1.0}
    PROMPTCODE_EVALUATION_NORMAL_RUNS: ${PROMPTCODE_EVALUATION_NORMAL_RUNS:-5}
    PROMPTCODE_EVALUATION_ADVERSARIAL_RUNS: ${PROMPTCODE_EVALUATION_ADVERSARIAL_RUNS:-2}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptcode
      POSTGRES_PASSWORD: promptcode
      POSTGRES_DB: promptcode
    ports:
      - "${PROMPTCODE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptcode"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    image: promptcode-sandbox:latest
    entrypoint: ["echo", "sandbox image built"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["python", "-m", "scripts.run_queue_worker"]
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
